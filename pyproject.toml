[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fairmeasure"
version = "0.1.0"
description = "Unified machine learning fairness measurement with bootstrap confidence intervals, effect sizes, and MLOps integrations."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Fairmeasure Maintainers" }
]
requires-python = ">=3.10"
keywords = [
    "machine-learning",
    "fairness",
    "bias",
    "mlops",
    "fairlearn",
    "aequitas",
    "statistics",
    "bootstrap",
    "data-science",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "fairlearn>=0.10",
    "aequitas>=0.42",
    "matplotlib>=3.7",
    "joblib>=1.3",
]

[project.optional-dependencies]
mlflow = ["mlflow>=2.8"]
dev = [
    "pytest>=7.4",
    "mlflow>=2.8",
    "jupyter",
    "nbconvert",
]

[project.urls]
Homepage = "https://github.com/fairmeasure/fairmeasure"
Repository = "https://github.com/fairmeasure/fairmeasure"
Documentation = "https://github.com/fairmeasure/fairmeasure#readme"
Issues = "https://github.com/fairmeasure/fairmeasure/issues"

[tool.setuptools]
packages = ["fairmeasure"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
